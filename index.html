<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weather Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h2>🌤 Weather Finder</h2>

        <input id="inputCity" placeholder="Enter city">
        <button onclick="findWeather()">Search</button>

        <div class="history" id="pastData"></div>

        <button id="clearBtn" onclick="clearHistory()">Clear History</button>

        <div class="weather-box">
            <div id="result">Search a city to see weather</div>
        </div>

    </div>

    <footer>
        Made with ❤️ by <span>Rajiv Jadon</span>
    </footer>

    <script src="script.js"></script>

</body>

</html>
